<div class="counter__container">
  <sl-button class="counter__button" i18n (click)="decrement()">Decrement</sl-button>
  <div class="counter__display">{{ count() }}</div>
  <sl-button class="counter__button" i18n (click)="increment()">Increment</sl-button>
  <sl-button class="counter__button counter__button--reset" i18n (click)="reset()">Reset</sl-button>
</div>
